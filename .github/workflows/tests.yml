name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  integration:
    name: Integration (PyViCare ${{ matrix.pyvicare }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest is the minimum in manifest.json, keep them in sync.
        pyvicare: ["2.63.0", "latest"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install -r requirements_test.txt

      - if: matrix.pyvicare != 'latest'
        run: pip install "PyViCare==${{ matrix.pyvicare }}"

      - run: pytest
